# CI — the server-side mirror of the local gate (scripts/ci.sh, the
# Makefile and .githooks/pre-push all call the same script; AGENTS.md §7).
#
# Today it builds only: the solution and the test project (which is not in
# the .slnx). Tests do not run here yet, because CI has no SQL Server and
# AuthFlowTests is red on master (docs/context/known-gaps.md G2, G3). When
# those close, add a SQL Server service, set SMARTMETRO_TEST_DB and drop
# --build-only.
#
# `ci` is the job to require on master in branch protection. Do not rename
# it without updating that rule.
#
# Third-party actions are pinned to full commit SHAs; the comment is the
# release the SHA was taken from.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (solution + test project)
        run: bash scripts/ci.sh --build-only
